root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./bin/demo-itd ./cmd/demo-itd"
entrypoint = ["./bin/demo-itd"]
include_ext = ["go"]
include_dir = ["cmd", "internal"]
exclude_dir = [".git", ".devenv", ".direnv", "bin", "tmp"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "200ms"

[log]
time = false

[misc]
clean_on_exit = true
